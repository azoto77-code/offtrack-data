name: Zone offline

# Builds the offline zones of OffTrack, listed in zone/zone.json: for each zone one release zona-<id>-<edition> with
# everything the app needs to work there without network, all from the same day's OpenStreetMap:
#   valhalla.tar        routing tiles, cut from the build of the zone's block, so routes cross between its zones
#   difficolta.pmtiles  unpaved roads and paths with their level 1-5
#   curve.pmtiles       contour lines every 20 m
#   quote.tar           elevations at 90 m, one .hgt per square of 1x1 degree
#   poi.json.gz         points of interest, as the app's poi table
#   ricerca.sqlite.gz   the search index: places, streets, house numbers (with the BAN in France), named points
#   mappa.pmtiles       the Protomaps base map, cut from the day's world file down to zoom 15
#   zona.json           size and sha256 of each file, outline, BRouter segments
# and the release zone-indice with indice.json, the list the app reads. The terrain does not change: contours and
# elevations are copied from the zone's last edition while CONTOURS stays the same.
# Valhalla is built once per block of zone.json (Italy and the Alps, Iberia...): built apart, two zones would not join
# and a route from Turin to Verona would stop at the border; one build of all Europe would not fit a runner.
# Runs on the 4th of January, April, July and October for all the blocks and zones; a pull request that changes it builds the blocks of
# PR_BLOCKS, cuts the zones of PR_ZONES among them and keeps the files as artifacts.
on:
  schedule:
    - cron: "0 3 4 1,4,7,10 *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/zone.yml"
      - "zone/**"
      - "tools/zone_*.py"
      - "tools/poi_zone.py"
      - "tools/dem_zone.py"
      - "tools/valhalla_zone.py"
      - "tools/test_poi_zone.py"
      - "tools/search_zone.py"
      - "tools/test_search_zone.py"

permissions:
  contents: write

concurrency:
  group: zone-${{ github.ref }}
  cancel-in-progress: false

env:
  GEOFABRIK: "https://download.geofabrik.de"
  # The Valhalla version must read the tiles the same way as the one inside valhalla-mobile on the phone.
  VALHALLA: "3.6.3"
  # Average speeds measured per country, road class and density (OpenStreetMapSpeeds), as on the public FOSSGIS
  # server: without them every road goes at its legal limit and the times come out a third too short.
  SPEEDS: "https://raw.githubusercontent.com/OpenStreetMapSpeeds/schema/c9c6872d5ec656f5d290944b44eb1a103ed539fa/default_speeds.json"
  # Change it when contours.py or dem_zone.py change: the next run traces contours and elevations again.
  CONTOURS: "20m-1"
  # What a pull request builds, keeping the files as artifacts and publishing nothing: "tutti" tries them all. A zone
  # is cut only when its block is built.
  PR_BLOCKS: "italia-alpi"
  PR_ZONES: "corsica liguria"
  # The Base Adresse Nationale, one file per French department, for the house numbers of the French zones.
  BAN: "https://adresse.data.gouv.fr/data/ban/adresses/latest/csv"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      zones: ${{ steps.list.outputs.zones }}
      blocks: ${{ steps.list.outputs.blocks }}
      edition: ${{ steps.list.outputs.edition }}
    steps:
      - uses: actions/checkout@v4

      - name: List the zones
        id: list
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime, json, os
          doc = json.load(open("zone/zone.json"))
          zones, blocks = doc["zones"], doc["blocks"]
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              if os.environ["PR_BLOCKS"] != "tutti":
                  blocks = [b for b in blocks if b["id"] in os.environ["PR_BLOCKS"].split()]
              if os.environ["PR_ZONES"] != "tutti":
                  zones = [z for z in zones if z["id"] in os.environ["PR_ZONES"].split()]
              zones = [z for z in zones if z["block"] in {b["id"] for b in blocks}]
          # A source is an extract of Geofabrik, or one cut to the border of a relation (a country Geofabrik
          # publishes only with its neighbours).
          for b in blocks:
              b["sources"] = [s if isinstance(s, dict) else {"geofabrik": s} for s in b["sources"]]
              b["zones"] = [z for z in zones if z["block"] == b["id"]]
          # A block without zones is built only in a pull request, to measure it.
          if os.environ["GITHUB_EVENT_NAME"] != "pull_request":
              blocks = [b for b in blocks if b["zones"]]
          print("zones=" + json.dumps(zones))
          print("blocks=" + json.dumps(blocks))
          print("edition=" + datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d"))
          EOF
          cat "$GITHUB_OUTPUT"

  valhalla:
    # One build per block, cut zone by zone. Each block is a job of its own: a failure stops only its zones.
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        block: ${{ fromJSON(needs.prepare.outputs.blocks) }}
    env:
      BLOCK: ${{ matrix.block.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the tools
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool python3-shapely

      - name: Download OpenStreetMap
        env:
          SOURCES: ${{ toJSON(matrix.block.sources) }}
        run: |
          mkdir -p work
          date -u +"%H:%M inizio blocco $BLOCK"
          echo "$SOURCES" | python3 -c "import json, sys; [print(s['geofabrik'], s.get('boundary', 0)) for s in json.load(sys.stdin)]" \
            | while read -r path rel; do
                f="work/src-$(echo "$path" | tr / -).osm.pbf"
                curl -fsSL --retry 3 -o "$f" "$GEOFABRIK/$path-latest.osm.pbf"
                if [ "$rel" != 0 ]; then
                  # Only the country inside the extract; its border also cuts the zone below.
                  python3 tools/boundary_poly.py "$f" "$rel" "work/r$rel.poly"
                  osmium extract -p "work/r$rel.poly" "$f" -o "work/cut.osm.pbf"
                  mv work/cut.osm.pbf "$f"
                fi
              done
          # Where two extracts overlap, along a border or Italy inside the Alps, each object is kept once.
          osmium merge work/src-*.osm.pbf -o work/area.osm.pbf
          rm work/src-*.osm.pbf
          # The administrative borders alone, to cut the zones named by a region code below once the tiles are built.
          osmium tags-filter work/area.osm.pbf r/boundary=administrative -o work/admin.osm.pbf
          curl -fsSL --retry 3 -o work/default_speeds.json "${SPEEDS}"
          ls -la work
          df -h / | tail -1
          date -u +"%H:%M estratti pronti"

      - name: Build the tiles
        run: |
          docker run --rm --user root --entrypoint bash -v "$PWD/work:/data" "ghcr.io/valhalla/valhalla:${VALHALLA}" -c '
            set -e
            valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-admin /data/admins.sqlite \
              --mjolnir-default-speeds-config /data/default_speeds.json --mjolnir-concurrency 4 > /data/valhalla.json
            valhalla_build_admins -c /data/valhalla.json /data/area.osm.pbf
            valhalla_build_tiles -c /data/valhalla.json /data/area.osm.pbf
            chmod -R a+rwX /data/tiles'
          du -sh work/area.osm.pbf work/tiles
          df -h / | tail -1
          rm work/area.osm.pbf
          date -u +"%H:%M tile costruiti per $BLOCK"

      - name: Check the travel times
        # Savona toll booth to Genova Pegli on the A10: about 50 minutes for Google and for FOSSGIS, 42 with these
        # speeds in Valhalla 3.6.3. With legal limits it came out at 33: outside 38-58 the speeds did not go in.
        if: contains(toJSON(matrix.block.sources), 'europe/italy')
        run: |
          docker run --rm --user root --entrypoint bash -v "$PWD/work:/data" "ghcr.io/valhalla/valhalla:${VALHALLA}" -c '
            valhalla_service /data/valhalla.json route "{\"locations\":[{\"lat\":44.3270,\"lon\":8.4520},{\"lat\":44.4290,\"lon\":8.8150}],\"costing\":\"motorcycle\"}"' > work/check.json
          python3 -c "
          import json, sys
          text = open('work/check.json').read()
          # The service may print its log lines before the answer.
          s = json.JSONDecoder().raw_decode(text[text.index('{\"trip\"'):])[0]['trip']['summary']
          print('Savona-Pegli: %.1f km in %.0f min' % (s['length'], s['time'] / 60))
          sys.exit(0 if 38 * 60 <= s['time'] <= 58 * 60 else 1)"

      - name: Cut the zones
        env:
          ZONES: ${{ toJSON(matrix.block.zones) }}
        run: |
          mkdir -p areas valhalla
          echo "$ZONES" | python3 -c "import json, sys; [print(z['id'], z['geofabrik'], z.get('boundary', 0)) for z in json.load(sys.stdin)]" \
            | while read -r id path rel; do
                if [ "$rel" = 0 ]; then curl -fsSL --retry 3 -o "areas/$id.poly" "$GEOFABRIK/$path.poly"
                elif [ -f "work/r$rel.poly" ]; then cp "work/r$rel.poly" "areas/$id.poly"
                else python3 tools/boundary_poly.py work/admin.osm.pbf "$rel" "areas/$id.poly"; fi
                python3 tools/valhalla_zone.py work/tiles "valhalla/$id.tar" "areas/$id.poly"
              done
          ls -la valhalla
          date -u +"%H:%M zone tagliate per $BLOCK"

      - name: Keep the zones for the next job
        if: ${{ matrix.block.zones[0] }}
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-${{ matrix.block.id }}
          path: valhalla/
          retention-days: 2
          compression-level: 1

  zone:
    needs: [prepare, valhalla]
    # A block that failed takes only its zones with it: the others go on and the index keeps their last edition.
    if: ${{ !cancelled() && needs.prepare.outputs.zones != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        zone: ${{ fromJSON(needs.prepare.outputs.zones) }}
    env:
      ID: ${{ matrix.zone.id }}
      REL: ${{ matrix.zone.boundary || 0 }}
      TAG: zona-${{ matrix.zone.id }}-${{ needs.prepare.outputs.edition }}
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the tools
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool tippecanoe gdal-bin python3-pyosmium python3-numpy python3-scipy \
            python3-shapely python3-pil

      - name: Check the tools
        working-directory: tools
        run: python3 -m unittest test_poi_zone test_search_zone test_difficulty_layer -v

      - name: Download OpenStreetMap
        run: |
          mkdir -p work areas out
          curl -fsSL --retry 3 -o work/zone.osm.pbf "$GEOFABRIK/${{ matrix.zone.geofabrik }}-latest.osm.pbf"
          if [ "$REL" != 0 ]; then
            # A country or a region inside a larger extract: its border from the extract, and only what lies within.
            python3 tools/boundary_poly.py work/zone.osm.pbf "$REL" "areas/$ID.poly"
            osmium extract -p "areas/$ID.poly" work/zone.osm.pbf -o work/cut.osm.pbf
            mv work/cut.osm.pbf work/zone.osm.pbf
          else
            curl -fsSL --retry 3 -o "areas/$ID.poly" "$GEOFABRIK/${{ matrix.zone.geofabrik }}.poly"
          fi
          ls -la work

      - name: Write the points of interest
        # Only what can be a point of interest, plus the tracks for their gates: a small part of the file.
        run: |
          osmium tags-filter work/zone.osm.pbf \
            nwr/amenity nwr/shop nwr/tourism nwr/man_made=water_tap nwr/natural=spring \
            nwr/emergency=defibrillator nwr/mountain_pass=yes nwr/ford=yes \
            n/barrier=gate n/highway=speed_camera w/highway=track \
            -o work/poi.osm.pbf
          python3 tools/poi_zone.py out/poi.json.gz "areas/$ID.poly" work/poi.osm.pbf

      - name: Write the search index
        # Everything with a name or a house number, and the municipal borders to tell where each one lies.
        env:
          ZONE: ${{ toJSON(matrix.zone) }}
        run: |
          osmium tags-filter work/zone.osm.pbf nwr/name nwr/addr:housenumber -o work/search.osm.pbf
          osmium tags-filter work/zone.osm.pbf r/admin_level=6,7,8 -o work/comuni.osm.pbf
          shopt -s nullglob
          # The BAN server is sometimes away: the zone is built all the same, with the house numbers of OSM alone.
          for d in $(echo "$ZONE" | jq -r '.ban // [] | .[]'); do
            curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors -o "work/ban-$d.csv.gz" "$BAN/adresses-$d.csv.gz" \
              || { echo "::warning::BAN $d non scaricata: civici solo da OpenStreetMap"; rm -f "work/ban-$d.csv.gz"; }
          done
          ban=(work/ban-*.csv.gz)
          python3 tools/search_zone.py build work/ricerca.sqlite "areas/$ID.poly" work/search.osm.pbf \
            work/comuni.osm.pbf ${ban:+--ban "${ban[@]}"} --gzip out/ricerca.sqlite.gz
          echo "$ZONE" | jq -r '.prove // [] | .[]' | while IFS= read -r q; do
            python3 tools/search_zone.py query work/ricerca.sqlite "$q"
          done
          rm -f work/search.osm.pbf work/comuni.osm.pbf work/ricerca.sqlite work/ban-*.csv.gz

      - name: Build the difficulty map
        # Tracks and unpaved roads from zoom 11, paths from 12 ("minz"); beyond 14 the app enlarges the last level.
        run: |
          osmium tags-filter work/zone.osm.pbf w/highway -o work/roads.osm.pbf
          rm work/zone.osm.pbf work/poi.osm.pbf
          python3 tools/difficulty_layer.py work/difficolta.geojsonseq work/roads.osm.pbf
          tippecanoe -q -P -o out/difficolta.pmtiles -l difficolta \
            -n "OffTrack difficoltà" -A "© OpenStreetMap contributors" \
            -Z11 -z14 --no-feature-limit --no-tile-size-limit \
            -j '{"*":["any",["==","minz",11],[">=","$zoom",12]]}' \
            work/difficolta.geojsonseq
          rm -r work

      - name: Cut the map
        # The Protomaps world file of the day, read with range requests: only the zone's tiles come down.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo protomaps/go-pmtiles --pattern '*_Linux_x86_64.tar.gz' -D pmtiles-cli
          tar -xzf pmtiles-cli/*.tar.gz -C pmtiles-cli
          python3 tools/zone_area.py "areas/$ID.poly" --geojson area.geojson
          for back in 0 1 2 3 4 5 6; do
            url="https://build.protomaps.com/$(date -u -d "-$back day" +%Y%m%d).pmtiles"
            curl -fsI "$url" > /dev/null && break
          done
          echo "Mappa da $url"
          pmtiles-cli/pmtiles extract "$url" out/mappa.pmtiles --region=area.geojson --maxzoom=15 --download-threads=8
          rm -r pmtiles-cli area.geojson

      - name: Take the terrain from the last edition
        id: terrain
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --limit 300 --json tagName --jq '.[].tagName' | grep "^zona-$ID-" | sort -r | head -1)
          if [ -n "$last" ] && gh release download "$last" -p zona.json -D prev \
             && [ "$(jq -r .contours prev/zona.json)" = "$CONTOURS" ] \
             && gh release download "$last" -p curve.pmtiles -p quote.tar -D out; then
            echo "Curve e quote da $last"
            echo "copied=true" >> "$GITHUB_OUTPUT"
          fi
          rm -rf prev

      - name: Trace the contour lines
        # Every 100 m from zoom 10, every 20 m from 12 ("minz"); beyond 12 the app enlarges it.
        if: steps.terrain.outputs.copied != 'true'
        run: |
          python3 tools/contours.py curve.geojsonseq "areas/$ID.poly" --cache dem-cache --jobs 4
          rm -rf dem-cache
          tippecanoe -q -P -o out/curve.pmtiles -l curve \
            -n "OffTrack curve di livello" -A "Terrain Tiles: SRTM, EU-DEM (Copernicus), Mapzen" \
            -Z10 -z12 --no-feature-limit --no-tile-size-limit \
            -j '{"*":["any",["==","minz",10],[">=","$zoom",12]]}' \
            curve.geojsonseq
          rm curve.geojsonseq

      - name: Write the elevations
        if: steps.terrain.outputs.copied != 'true'
        run: python3 tools/dem_zone.py out/quote.tar "areas/$ID.poly"

      - name: Take the routing tiles
        uses: actions/download-artifact@v4
        with:
          name: valhalla-${{ matrix.zone.block }}
          path: valhalla

      - name: Describe the zone
        run: |
          mv "valhalla/$ID.tar" out/valhalla.tar
          rm -r valhalla
          python3 tools/zone_index.py zone out zone/zone.json "$ID" "areas/$ID.poly" \
            --edition "${{ needs.prepare.outputs.edition }}" --tag "$TAG" --valhalla "$VALHALLA" --contours "$CONTOURS"
          ls -la out

      - name: Keep the test files
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: zona-${{ matrix.zone.id }}
          path: out/
          retention-days: 14
          compression-level: 1

      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        # Never "latest": that one stays the Valhalla release the app reads today.
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/* --title "Zona ${{ matrix.zone.name }} ${{ needs.prepare.outputs.edition }}" \
            --latest=false --notes "Zona offline ${{ matrix.zone.name }} di OffTrack. $(jq -r .attribution out/zona.json)"

      - name: Keep the last two editions
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 300 --json tagName --jq '.[].tagName' \
            | grep "^zona-$ID-" | sort -r | tail -n +3 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag

  index:
    # The list the app reads: the newest edition of every zone, also when one of them failed this month.
    needs: [prepare, valhalla, zone]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.zone.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the tools
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-shapely

      - name: Take the test zones
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          pattern: zona-*
          path: zones

      - name: Take the published zones
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh release list --limit 300 --json tagName --jq '.[].tagName')
          for id in $(jq -r '.zones[].id' zone/zone.json); do
            last=$(echo "$tags" | grep "^zona-$id-" | sort -r | head -1)
            [ -n "$last" ] && gh release download "$last" -p zona.json -D "zones/$id"
          done
          ls -R zones

      - name: Write the index
        run: python3 tools/zone_index.py index indice.json zones/*/zona.json

      - name: Publish the index
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        # A release of its own that never changes name, so the app always finds the index at the same address.
        run: |
          gh release view zone-indice >/dev/null 2>&1 \
            || gh release create zone-indice --title "Indice zone offline" --latest=false \
                 --notes "Elenco delle zone offline di OffTrack: indice.json."
          gh release upload zone-indice indice.json --clobber
