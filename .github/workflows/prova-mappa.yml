name: Prova mappa OpenFreeMap
# A trial, not to be merged: cuts the OpenFreeMap world file of the week next to the Protomaps one of the day for a
# few zones, as "Cut the map" of zone.yml does, to compare their weight. Protomaps is cut both to zoom 15, as in the
# zones, and to zoom 14, where OpenFreeMap stops. The files are kept as artifacts; nothing is published. For a few
# places, prova-mappa/conta.py counts what each file keeps and draws it; tables and drawings are committed to the
# pull request's branch under prova-mappa/anteprime/.
on:
  pull_request:
    paths:
      - ".github/workflows/prova-mappa.yml"
      - ".github/prova-mappa/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mappa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zone:
          - {id: nord-ovest, geofabrik: europe/italy/nord-ovest,
             places: "44.4075 8.9340 genova-centro 44.1906 8.1318 bardineto 45.0705 7.0545 colle-delle-finestre"}
          - {id: corsica, geofabrik: europe/france/corse,
             places: "41.9193 8.7386 ajaccio-centro 41.7497 9.1713 zonza"}
    env:
      ID: ${{ matrix.zone.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-shapely python3-matplotlib
          pip install --quiet --break-system-packages pmtiles mapbox-vector-tile
          gh release download --repo protomaps/go-pmtiles --pattern '*_Linux_x86_64.tar.gz' -D pmtiles-cli
          tar -xzf pmtiles-cli/*.tar.gz -C pmtiles-cli

      - name: Take the border of the zone
        run: |
          mkdir -p out
          curl -fsSL --retry 3 -o area.poly "https://download.geofabrik.de/${{ matrix.zone.geofabrik }}.poly"
          python3 tools/zone_area.py area.poly --geojson area.geojson

      - name: Cut both maps
        run: |
          for back in 0 1 2 3 4 5 6; do
            pm="https://build.protomaps.com/$(date -u -d "-$back day" +%Y%m%d).pmtiles"
            curl -fsI "$pm" > /dev/null && break
          done
          # The week OpenFreeMap's server is showing, as OpenFreeMap.kt in the app finds it.
          ofm=$(curl -fsSL https://tiles.openfreemap.org/planet | python3 -c 'import json,sys; print(json.load(sys.stdin)["tiles"][0])' \
            | sed -E 's#^https://tiles.openfreemap.org/planet/([^/]+)/.*#https://btrfs.openfreemap.com/areas/planet/\1/tiles.pmtiles#')
          echo "Protomaps: $pm"
          echo "OpenFreeMap: $ofm"
          # OpenFreeMap's server sometimes drops the connection (4 November): a few tries each.
          extract() {
            for try in 1 2 3; do
              pmtiles-cli/pmtiles extract "$1" "$2" --region=area.geojson --maxzoom="$3" --download-threads=8 && return 0
              sleep 20
            done
            return 1
          }
          extract "$pm" out/protomaps-z15.pmtiles 15
          extract "$pm" out/protomaps-z14.pmtiles 14
          extract "$ofm" out/openfreemap-z14.pmtiles 14

      - name: Compare
        run: |
          {
            echo "### $ID"
            echo "| file | MB |"
            echo "|---|---|"
            for f in out/*.pmtiles; do
              python3 -c 'import os,sys; f=sys.argv[1]; print(f"| {os.path.basename(f)} | {os.path.getsize(f)/2**20:.1f} |")' "$f"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for f in out/*.pmtiles; do echo "== $f"; pmtiles-cli/pmtiles show "$f" | head -20; done

      - name: Count and draw what each file keeps
        run: |
          set -o pipefail
          python3 .github/prova-mappa/conta.py out "anteprime/$ID" ${{ matrix.zone.places }} | tee "anteprime-$ID.md"
          mv "anteprime-$ID.md" "anteprime/$ID/conteggi.md"
          cat "anteprime/$ID/conteggi.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the drawings to the branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv anteprime "$RUNNER_TEMP/anteprime"
          git fetch -q origin "$GITHUB_HEAD_REF"
          git checkout -q -B prova "origin/$GITHUB_HEAD_REF"
          for attempt in 1 2 3 4 5; do
            mkdir -p prova-mappa/anteprime
            rm -rf "prova-mappa/anteprime/$ID"
            cp -r "$RUNNER_TEMP/anteprime/$ID" prova-mappa/anteprime/
            git add prova-mappa/anteprime
            git commit -q -m "Trial previews of the maps for $ID" || exit 0
            git push -q origin "HEAD:$GITHUB_HEAD_REF" && exit 0
            # The other zone pushed first: start again from its commit.
            git fetch -q origin "$GITHUB_HEAD_REF"
            git reset -q --hard "origin/$GITHUB_HEAD_REF"
          done
          exit 1

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: mappe-${{ matrix.zone.id }}
          path: out/
          retention-days: 14
          compression-level: 0
